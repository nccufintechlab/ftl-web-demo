# 正式站：main 推送、手動、或後台發布（repository_dispatch: content-updated）都會
# 從 Supabase 拉內容 → build → 部署到 GitHub Pages，並把新快照 commit 回 main。
# 沒有設 SUPABASE secrets 時，pull-content 什麼都不做，沿用 repo 內的快照。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_saved_content:
        description: "Emergency deploy: use committed content and bundled images without Supabase"
        type: boolean
        default: false
        required: false
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Pull published content from Supabase
        if: ${{ !inputs.use_saved_content }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/pull-content.ts
      - run: npm run typecheck
      - run: node scripts/check-internal-links.mjs
      - run: npm run test:unit
      - name: Build (public Supabase config baked in for /admin/)
        env:
          # The custom domain serves out/ at /, without the repository prefix.
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Verify custom-domain asset and navigation paths
        run: node --test tests/export/custom-domain.test.mjs
      - name: Install browsers for saved-content rescue verification
        if: ${{ inputs.use_saved_content }}
        run: npx playwright install --with-deps chromium webkit
      - name: Verify the public site before saved-content rescue
        if: ${{ inputs.use_saved_content }}
        run: npx playwright test tests/visual --workers=2
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Commit refreshed snapshot
        if: ${{ !inputs.use_saved_content }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/content.snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m "內容快照更新 [skip ci]"
          # 建置期間可能有人推了別的 commit（2026-09-17 就撞過一次），先接上再推
          git pull --rebase --autostash origin main   # 建置會弄髒 next-env.d.ts 等自動檔，autostash 先收起來
          git push
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
